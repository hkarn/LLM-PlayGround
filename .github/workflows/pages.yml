name: GitHub Pages

# Publishes public/ as a static site at https://<owner>.github.io/<repo>/.
# Without server.js the app calls the chosen provider directly from the browser.
# Enable once under Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Pages lets browsers cache files for 10 minutes. Tag the entry script, style.css and
      # every module import with the commit, so a new index.html never runs with an old
      # cached module (all imports of one module must carry the same tag).
      - name: Cache-bust assets
        run: |
          V=${GITHUB_SHA::7}
          sed -i -E "s/(js\/main\.js|style\.css)\"/\1?v=$V\"/g" public/index.html
          find public/js -name '*.js' -exec sed -i -E "s/(from '[^']+\.js)'/\1?v=$V'/g" {} +
          # Data files (providers/*.json) are fetched with ?v=ASSET_VERSION; give it the commit too.
          sed -i -E "s/^export const ASSET_VERSION = 'dev';/export const ASSET_VERSION = '$V';/" public/js/core.js
          grep -n "ASSET_VERSION = " public/js/core.js
          grep -nE "main\.js|style\.css" public/index.html
          grep -rn "^import" public/js | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
