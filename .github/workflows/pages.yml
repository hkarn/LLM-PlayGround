name: GitHub Pages

# Publishes public/ as a static site at https://<owner>.github.io/<repo>/.
# Without server.js the app calls Requesty directly from the browser.
# Enable once under Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Pages lets browsers cache files for 10 minutes. Tag app.js and style.css with the
      # commit so a new index.html never runs with an old cached script.
      - name: Cache-bust assets
        run: sed -i -E "s/(app\.js|style\.css)\"/\1?v=${GITHUB_SHA::7}\"/g" public/index.html && grep -nE "app\.js|style\.css" public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
