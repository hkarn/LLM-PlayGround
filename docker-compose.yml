services:
  llm-playground:
    image: ghcr.io/hkarn/llm-playground:latest
    # Uncomment to build from source instead of pulling the published image:
    # build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Optional: preset keys so the UI works without typing one.
      # Put REQUESTY_API_KEY=sk-..., OPENROUTER_API_KEY=sk-or-..., LLMGATEWAY_API_KEY=llmgtwy_... and/or ANTHROPIC_API_KEY=sk-ant-... in a .env file next to this file.
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLMGATEWAY_API_KEY: ${LLMGATEWAY_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The port is only published on 127.0.0.1, so custom endpoints are allowed by default.
      # Set it to 0 if you publish the port to other machines.
      ALLOW_ANY_UPSTREAM: ${ALLOW_ANY_UPSTREAM:-1}
    restart: unless-stopped
